<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Digital Deconstruction: Interactive Art</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        :root { --bg-color: #050507; --accent: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background-color: var(--bg-color); font-family: 'Helvetica', Arial, sans-serif; }
        
        #background-video-container {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
            overflow: hidden;
        }
        
        #input_video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            /* Reduced blur and increased brightness for a clearer background */
            filter: blur(6px) grayscale(0.4) brightness(0.45); 
        }

        #canvas-container { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            z-index: 3; 
            pointer-events: none;
        }

        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 10; color: #fff; letter-spacing: 2px; text-align: center;
            font-size: 0.8rem; font-weight: 300;
        }
        
        #ui-overlay {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 5;
            pointer-events: none;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #hand-stats {
            color: rgba(255, 255, 255, 0.4); 
            font-size: 0.65rem; 
            letter-spacing: 1px;
            font-family: 'Courier New', Courier, monospace;
        }

        #instructions {
            text-align: center; 
            color: rgba(255,255,255,0.3); 
            font-size: 0.7rem; 
            letter-spacing: 4px; 
            text-transform: uppercase;
            font-weight: 300;
        }
    </style>
</head>
<body>

    <div id="loading">CALIBRATING NEURAL LINK...</div>
    
    <div id="background-video-container">
        <video id="input_video" autoplay playsinline></video>
    </div>

    <div id="ui-overlay">
        <div id="hand-stats">STATUS: STANDBY | SCALE: 1.0</div>
        <div id="instructions">
            BLINK TO PULSE | SPREAD HANDS TO SCALE
        </div>
        <div></div> <!-- Empty bottom spacer -->
    </div>

    <div id="canvas-container"></div>

    <script id="vertexShader" type="x-shader/x-vertex">
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    </script>

    <script id="fragmentShader" type="x-shader/x-fragment">
        varying vec2 vUv;
        uniform sampler2D tDiffuse;
        uniform vec2 uvOffset;
        uniform vec2 uvRandomOffset;
        uniform float uvScale;
        uniform int filterType;
        uniform float time;
        uniform float borderThickness;
        uniform float pixelScale;
        uniform float blinkPulse;

        float rand(vec2 co){
            return fract(sin(dot(co.xy ,vec2(12.9898,78.233))) * 43758.5453);
        }

        void main() {
            vec2 pixUv = floor(vUv * pixelScale) / pixelScale;
            vec2 sampledUv = uvOffset + uvRandomOffset + (pixUv - 0.5) * uvScale;
            sampledUv = clamp(sampledUv, 0.005, 0.995);
            
            vec4 texel = texture2D(tDiffuse, sampledUv);
            vec3 color = texel.rgb;

            if (filterType == 1) { 
                float gray = dot(color, vec3(0.299, 0.587, 0.114));
                color = vec3(smoothstep(0.2, 0.8, gray));
            } 
            else if (filterType == 2) { 
                color *= vec3(1.1, 0.9, 0.7); 
                float gray = dot(color, vec3(0.299, 0.587, 0.114));
                color = mix(color, vec3(gray), 0.3);
            } 
            else if (filterType == 3) { 
                float noise = rand(vUv + time) * 0.15;
                color += vec3(noise - 0.075);
            }
            else if (filterType == 4) {
                float gray = dot(color, vec3(0.299, 0.587, 0.114));
                color = vec3(gray * 1.2, gray * 0.4, gray * 0.2);
            }

            vec3 glow = vec3(0.05, 0.08, 0.12) * blinkPulse;
            color += glow;

            float edge = borderThickness;
            float borderAlpha = smoothstep(0.0, edge, vUv.x) * smoothstep(1.0, 1.0 - edge, vUv.x) *
                               smoothstep(0.0, edge, vUv.y) * smoothstep(1.0, 1.0 - edge, vUv.y);
            
            if (borderAlpha < 1.0) {
                color = mix(color + 0.15, color, borderAlpha);
            }

            gl_FragColor = vec4(color, 1.0);
        }
    </script>

    <script>
        const videoElement = document.getElementById('input_video');
        const loading = document.getElementById('loading');
        const handStats = document.getElementById('hand-stats');

        let faceResults = null;
        let handResults = null;
        let lastBlinkState = false;
        let blinkPulse = 0;
        let globalHandScale = 1.0; 
        let isProcessing = false;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 10;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const videoTexture = new THREE.VideoTexture(videoElement);
        videoTexture.minFilter = THREE.LinearFilter;
        
        const FRAGMENT_COUNT = 40; 
        const fragments = [];
        const fragGroup = new THREE.Group();
        scene.add(fragGroup);

        const corePoints = [
            1, 4, 5, 197, 195, 2, 
            33, 133, 159, 145, 
            263, 362, 386, 374, 
            61, 291, 0, 13, 14, 17, 
            101, 205, 50, 123, 234, 
            330, 425, 280, 352, 454, 
            168, 6, 197, 151, 8 
        ];

        function getRandomSize() {
            const base = 0.4 + Math.random() * 0.6; 
            const ratio = 0.7 + Math.random() * 0.6;
            return { w: base * ratio, h: base };
        }

        function createFragment(index) {
            const size = getRandomSize();
            const geometry = new THREE.PlaneGeometry(size.w, size.h);
            const personalUvScale = 0.12 + Math.random() * 0.1;

            const material = new THREE.ShaderMaterial({
                uniforms: {
                    tDiffuse: { value: videoTexture },
                    uvOffset: { value: new THREE.Vector2(0.5, 0.5) },
                    uvRandomOffset: { value: new THREE.Vector2((Math.random()-0.5)*0.1, (Math.random()-0.5)*0.1) },
                    uvScale: { value: personalUvScale },
                    filterType: { value: Math.floor(Math.random() * 5) },
                    time: { value: 0.0 },
                    borderThickness: { value: 0.025 },
                    pixelScale: { value: 90.0 }, 
                    blinkPulse: { value: 0.0 }
                },
                vertexShader: document.getElementById('vertexShader').textContent,
                fragmentShader: document.getElementById('fragmentShader').textContent,
                transparent: true
            });

            const mesh = new THREE.Mesh(geometry, material);
            return {
                mesh,
                pointIndex: corePoints[index % corePoints.length],
                zOffset: index * 0.008,
                jitter: new THREE.Vector2((Math.random()-0.5) * 0.08, (Math.random()-0.5) * 0.08),
                burstOffset: new THREE.Vector2(0, 0),
                rotationPhase: Math.random() * Math.PI * 2,
                baseUvScale: personalUvScale,
                individualScale: 0.7 + Math.random() * 0.6
            };
        }

        for (let i = 0; i < FRAGMENT_COUNT; i++) {
            const f = createFragment(i);
            fragments.push(f);
            fragGroup.add(f.mesh);
        }

        function checkBlink(landmarks) {
            const leftEyeTop = landmarks[159].y;
            const leftEyeBottom = landmarks[145].y;
            const rightEyeTop = landmarks[386].y;
            const rightEyeBottom = landmarks[374].y;
            return Math.abs(leftEyeTop - leftEyeBottom) < 0.015 || Math.abs(rightEyeTop - rightEyeBottom) < 0.015;
        }

        function triggerBlinkExplosion() {
            blinkPulse = 0.8; 
            fragments.forEach(f => {
                f.mesh.material.uniforms.filterType.value = Math.floor(Math.random() * 5);
                f.burstOffset.set((Math.random()-0.5) * 0.3, (Math.random()-0.5) * 0.3);
            });
        }

        function updateHandScaling() {
            if (handResults && handResults.multiHandLandmarks && handResults.multiHandLandmarks.length >= 2) {
                const h1 = handResults.multiHandLandmarks[0][8]; 
                const h2 = handResults.multiHandLandmarks[1][8]; 
                const dist = Math.sqrt(Math.pow(h1.x - h2.x, 2) + Math.pow(h1.y - h2.y, 2));
                const targetScale = Math.min(2.5, Math.max(0.6, dist * 4.5));
                globalHandScale += (targetScale - globalHandScale) * 0.15;
                handStats.innerText = `STATUS: ACTIVE | SCALE: ${globalHandScale.toFixed(2)}`;
                handStats.style.opacity = "0.7";
            } else {
                globalHandScale += (1.0 - globalHandScale) * 0.05; 
                handStats.innerText = `STATUS: STANDBY | SCALE: ${globalHandScale.toFixed(2)}`;
                handStats.style.opacity = "0.3";
            }
        }

        function update() {
            updateHandScaling();

            if (!faceResults?.multiFaceLandmarks?.[0]) {
                fragGroup.visible = false;
                return;
            }
            fragGroup.visible = true;

            const landmarks = faceResults.multiFaceLandmarks[0];
            const videoAspect = 640 / 480;
            const worldScale = 14; 
            const currentTime = Date.now() * 0.001;

            const isBlinking = checkBlink(landmarks);
            if (isBlinking && !lastBlinkState) triggerBlinkExplosion();
            lastBlinkState = isBlinking;
            blinkPulse *= 0.94; 

            const noseTip = landmarks[1];
            const minX = Math.min(...landmarks.map(p => p.x));
            const maxX = Math.max(...landmarks.map(p => p.x));
            const headWidth = maxX - minX;

            fragments.forEach((frag, i) => {
                const anchor = landmarks[frag.pointIndex];
                const burstEffect = Math.sin(blinkPulse * Math.PI * 0.4);
                
                const dx = (noseTip.x - anchor.x) * 0.12;
                const dy = (noseTip.y - anchor.y) * 0.12;

                const targetX = anchor.x + dx + (frag.jitter.x * (0.6 + blinkPulse)) + (frag.burstOffset.x * burstEffect);
                const targetY = anchor.y + dy + (frag.jitter.y * (0.6 + blinkPulse)) + (frag.burstOffset.y * burstEffect);

                const x = 1 - targetX;
                const y = targetY;

                const breathing = 1.0 + Math.sin(blinkPulse * 2.5) * 0.2;
                const scaleFactor = headWidth * 2.8 * frag.individualScale * globalHandScale * breathing; 
                frag.mesh.scale.set(scaleFactor, scaleFactor, 1);

                const targetPos = new THREE.Vector3(
                    (x - 0.5) * worldScale * videoAspect,
                    -(y - 0.5) * worldScale,
                    frag.zOffset + (blinkPulse * 0.3)
                );

                frag.mesh.position.lerp(targetPos, 0.2); 
                frag.mesh.rotation.z = Math.sin(currentTime * 0.12 + frag.rotationPhase) * 0.03 + (blinkPulse * 0.35);

                const mat = frag.mesh.material;
                mat.uniforms.uvOffset.value.set(x, y);
                mat.uniforms.time.value = currentTime;
                mat.uniforms.uvScale.value = frag.baseUvScale + (blinkPulse * 0.03);
                mat.uniforms.blinkPulse.value = blinkPulse;
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            update();
            renderer.render(scene, camera);
        }

        async function start() {
            const faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
            faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.7 });
            faceMesh.onResults(res => { faceResults = res; loading.style.display = 'none'; });

            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
            hands.onResults(res => { handResults = res; });

            new Camera(videoElement, {
                onFrame: async () => {
                    if (isProcessing) return;
                    isProcessing = true;
                    try {
                        await faceMesh.send({image: videoElement}); 
                        await hands.send({image: videoElement});
                    } catch(e) {}
                    isProcessing = false;
                },
                width: 640, height: 480
            }).start();
            animate();
        }

        window.onload = start;
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
